[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workboard"
version = "0.1.0"
description = "Offline-first desktop board for shared work planning and progress"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.7"]

[project.scripts]
workboard = "workboard.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workboard"
version = "0.1.0"
description = "Verification work planning and progress tracking"
requires-python = ">=3.11"

[project.scripts]
workboard = "workboard.main:main"

[tool.setuptools.packages.find]
where = ["src"]
